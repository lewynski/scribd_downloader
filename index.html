<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scribd Downloader</title>
    <style>
        /* --- iOS Design System Variables --- */
        :root {
            --bg-color: #F2F2F7;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --accent-color: #007AFF; /* Apple Blue */
            --separator: rgba(60, 60, 67, 0.12);
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --radius: 12px;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobile Container Simulation on Desktop */
        .app-container {
            width: 100%;
            max-width: 414px; /* iPhone Max width */
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 5px;
        }

        /* Input Group */
        .input-group {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--separator);
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255,255,255,0.5);
            transition: all 0.2s ease;
        }

        input[type="url"]:focus {
            background: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--accent-color);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Result Card */
        .result-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: none; /* Hidden by default */
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .document-preview {
            height: 180px;
            background-color: #eee;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .doc-info {
            padding: 16px;
        }

        .doc-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .doc-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .action-btn {
            background: rgba(0, 122, 255, 0.1);
            color: var(--accent-color);
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            display: block;
            text-align: center;
            font-weight: 500;
        }

        /* Loading State */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error Message */
        .error-msg {
            color: #FF3B30;
            font-size: 14px;
            margin-top: 8px;
            display: none;
            text-align: center;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Scribd Downloader</h1>
        <p class="subtitle">Get your PDF documents instantly.</p>
    </header>

    <div class="input-group">
        <input type="url" id="urlInput" placeholder="Paste Scribd URL here..." autocomplete="off">
        <button id="fetchBtn" onclick="handleFetch()">
            <span id="btnText">Get Document</span>
            <div class="spinner" id="spinner"></div>
        </button>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="result-card" id="resultCard">
        <!-- Image will be injected here -->
        <div class="document-preview" id="previewImg"></div>
        <div class="doc-info">
            <div class="doc-title" id="docTitle">Document Title</div>
            <div class="doc-meta" id="docMeta">Author • Pages</div>
            <a href="#" class="action-btn" id="downloadLink" target="_blank">Download PDF</a>
        </div>
    </div>

    <footer>
        Built for NoTrack
    </footer>
</div>

<script>
    async function handleFetch() {
        const urlInput = document.getElementById('urlInput');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const fetchUrl = urlInput.value.trim();

        // Reset UI
        errorMsg.style.display = 'none';
        resultCard.style.display = 'none';
        
        if (!fetchUrl) return;

        // Loading State
        btnText.style.display = 'none';
        spinner.style.display = 'block';

        try {
            // Call our Vercel Serverless Function
            const response = await fetch('/api/scribd', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: fetchUrl })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Something went wrong');
            }

            // Render the result
            renderResult({
                title: data.title || "Document",
                author: data.author || "Unknown Author",
                pages: data.pages || "?",
                image: data.thumbnail || "https://via.placeholder.com/150",
                downloadUrl: data.pdfUrl || "#"
            });

        } catch (err) {
            showError(err.message);
        } finally {
            // Reset Button
            btnText.style.display = 'block';
            spinner.style.display = 'none';
        }
    }

    function renderResult(data) {
        document.getElementById('docTitle').innerText = data.title;
        document.getElementById('docMeta').innerText = `${data.author} • ${data.pages} pages`;
        document.getElementById('previewImg').style.backgroundImage = `url('${data.image}')`;
        document.getElementById('downloadLink').href = data.downloadUrl;
        document.getElementById('resultCard').style.display = 'block';
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.innerText = msg;
        el.style.display = 'block';
    }
</script>

</body>
</html>
