<script>
    async function handleFetch() {
        const urlInput = document.getElementById('urlInput');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const fetchUrl = urlInput.value.trim();

        // Reset UI
        errorMsg.style.display = 'none';
        resultCard.style.display = 'none';
        
        if (!fetchUrl) return;

        // Loading State
        btnText.style.display = 'none';
        spinner.style.display = 'block';

        try {
            // Call our Vercel Serverless Function
            const response = await fetch('/api/scribd', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: fetchUrl })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Something went wrong');
            }

            // Render the result
            // Note: Ensure 'data' fields match what the Apify Actor returns.
            // If the actor returns different keys, adjust these accordingly.
            renderResult({
                title: data.title || "Document",
                author: data.author || "Unknown Author",
                pages: data.pages || "?",
                image: data.thumbnail || "https://via.placeholder.com/150",
                downloadUrl: data.pdfUrl || "#"
            });

        } catch (err) {
            showError(err.message);
        } finally {
            // Reset Button
            btnText.style.display = 'block';
            spinner.style.display = 'none';
        }
    }

    function renderResult(data) {
        document.getElementById('docTitle').innerText = data.title;
        document.getElementById('docMeta').innerText = `${data.author} • ${data.pages} pages`;
        document.getElementById('previewImg').style.backgroundImage = `url('${data.image}')`;
        document.getElementById('downloadLink').href = data.downloadUrl;
        document.getElementById('resultCard').style.display = 'block';
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.innerText = msg;
        el.style.display = 'block';
    }
</script>
